name: Publish

# Changesets flow for @tgstack/nestjs-grammy (the only published package):
# - pending changesets on main → opens/updates a "Version packages" pull request;
# - merging that pull request → publishes to npm with provenance.
# Requires npm trusted publishing for this repository (or an NPM_TOKEN secret).

on:
  push:
    branches: [main]
  # Cho phép kích hoạt thủ công workflow Publish từ giao diện GitHub Actions
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance / trusted publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Version pull request or publish
        uses: changesets/action@v2
        # Các tham số cấu hình theo chuẩn mới của changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
